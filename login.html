<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BetGalo - Entrar na Conta</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Julius+Sans+One&family=Libre+Barcode+39+Text&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/cabecalho.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body class="bg-slate-900 text-white font-sans min-h-screen flex flex-col justify-between">

    <!-- CABEÇALHO PADRÃO -->
    <header class="cabecalho">
        <div class="logo">
            <img src="img/image 22.png" id="logo-do-site" alt="logo">
            <span id="logo-texto">BET GALO</span>
        </div>

        <nav class="menu">
            <a href="index.html" class="menu-item item-ativo">HOME</a>
            <a href="apostas.html" class="menu-item">APOSTAS</a>
            <a href="cassino.html" class="menu-item">CASSINO</a>
        </nav>

        <div class="link-perfil flex gap-3">
            <a href="cadastro.html" class="text-xs bg-slate-700 hover:bg-slate-600 text-white font-bold py-2 px-4 rounded-lg transition uppercase tracking-wider no-underline">Cadastrar</a>
        </div>
    </header>

    <!-- FORMULÁRIO DE LOGIN -->
    <main class="container mx-auto p-4 md:p-8 flex-grow flex items-center justify-center">
        <div class="w-full max-w-md bg-[#333] p-8 rounded-2xl shadow-xl border border-slate-700">
            
            <div class="text-center mb-6">
                <h2 class="text-2xl font-black tracking-wide uppercase text-amber-500">Acesse sua Conta</h2>
                <p class="text-slate-400 text-xs mt-1">Insira suas credenciais para começar a apostar</p>
            </div>

            <form id="loginForm" onsubmit="lidarLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-xs text-slate-400 mb-1 font-semibold uppercase tracking-wider">E-mail</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-500">
                            <i class="fa-solid fa-envelope"></i>
                        </span>
                        <input type="email" id="email" required placeholder="exemplo@email.com" class="w-full bg-slate-900 border border-slate-700 focus:border-amber-500 rounded-lg p-2.5 pl-10 text-sm text-white outline-none transition">
                    </div>
                </div>

                <div>
                    <div class="flex justify-between items-center mb-1">
                        <label class="block text-xs text-slate-400 font-semibold uppercase tracking-wider">Senha</label>
                        <a href="#" class="text-xs text-amber-500 hover:underline">Esqueceu a senha?</a>
                    </div>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-500">
                            <i class="fa-solid fa-lock"></i>
                        </span>
                        <input type="password" id="password" required placeholder="••••••••" class="w-full bg-slate-900 border border-slate-700 focus:border-amber-500 rounded-lg p-2.5 pl-10 text-sm text-white outline-none transition">
                    </div>
                </div>

                <div class="pt-2">
                    <button type="submit" class="w-full flex items-center justify-center gap-2 bg-amber-500 hover:bg-amber-600 text-slate-950 font-black py-3 px-4 rounded-xl text-sm transition uppercase tracking-wider shadow-lg border-0 cursor-pointer">
                        <i class="fa-solid fa-right-to-bracket"></i> Entrar
                    </button>
                </div>
            </form>

            <div class="mt-6 pt-4 border-t border-slate-700/60 text-center text-sm text-slate-400">
                Não tem uma conta? <a href="cadastro.html" class="text-amber-500 font-bold hover:underline">Cadastre-se já</a>
            </div>
        </div>
    </main>

    <!-- RODAPÉ PADRÃO -->
    <footer>
        <div class="rodape">
            <img src="img/Times.png" alt="times">
            <div class="sobre-nos">
                <h1>Sobre nós:</h1>
                <p>BetGalo.com é um site operado pela Kaizen Gaming Brasil Ltda. ...</p>
            </div>
            <!-- ... resto do seu rodapé ... -->
        </div>
    </footer>

    <script>
        function lidarLogin(event) {
            event.preventDefault();
            // Simula salvamento de estado de login
            localStorage.setItem('userLogado', 'true');
            // Redireciona para o perfil após logar
            window.location.href = 'perfil.html';
        }
    </script>
</body>
</html>
