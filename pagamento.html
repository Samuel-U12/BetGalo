<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/cabecalho.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/pagamento.css">
    <link rel="icon" href="./img/logo.ico" type="image/ico">
    <link href="https://fonts.googleapis.com/css2?family=Julius+Sans+One&family=Libre+Barcode+39+Text&display=swap"
        rel="stylesheet">
    <title>BetGalo</title>
</head>

<body>
    <header class="cabecalho">
        <div class="logo">
            <img src="img/image 22.png" id="logo-do-site" alt="logo">
            <span id="logo-texto">BET GALO</span>
        </div>

        <nav class="menu">
            <a href="index.html" class="menu-item item-ativo">HOME</a>
            <a href="apostas.html" class="menu-item">APOSTAS</a>
            <a href="cassino.html" class="menu-item">CASSINO</a>
        </nav>

        <div class="link-perfil">
            <a href="pagamento.html"><div class="card-container">R$200000</div></a>
            <a href="perfil.html"><img src="img/perfil.jpg" alt="Foto de perfil" id="foto-perfil"></a>
        </div>
    </header>

    <div class="payment-card">
        <div class="tabs">
            <button class="tab active">CARTÃO</button>
            <button class="tab">PIX</button>
        </div>

        <form class="payment-form">
            <div class="input-group">
                <input type="text" placeholder="NÚMERO DO CARTÃO">
                <span class="icon">💳</span>
            </div>

            <div class="input-group">
                <input type="text" placeholder="DATA (MM/AA)">
                <span class="icon">📅</span>
            </div>

            <div class="input-group">
                <input type="password" placeholder="CÓDIGO DE SEGURANÇA">
                <span class="icon">🔒</span>
            </div>

            <button type="submit" class="btn-submit">CADASTRAR CARTÃO</button>
        </form>
    </div>

</body>

</html>
