<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/cabecalho.css">
    <link rel="stylesheet" href="css/pagamento.css">
    <link rel="icon" href="./img/logo.ico" type="image/ico">
    <title>BetGalo - Pagamento</title>
</head>

<body>
    <header class="cabecalho">
        <div class="logo">
            <img src="img/image 22.png" id="logo-do-site" alt="logo">
            <span id="logo-texto">BET GALO</span>
        </div>
        <nav class="menu">
            <a href="index.html" class="menu-item">HOME</a>
            <a href="apostas.html" class="menu-item">APOSTAS</a>
            <a href="cassino.html" class="menu-item">CASSINO</a>
        </nav>
        <a href="#" class="link-perfil">
            <img src="img/perfil.jpg" alt="Foto de perfil" id="foto-perfil">
        </a>
    </header>

    <main class="payment-card">
        <div class="tabs">
            <button class="tab active" id="btn-cartao" onclick="trocarAba('cartao')">CARTÃO</button>
            <button class="tab" id="btn-pix" onclick="trocarAba('pix')">PIX</button>
        </div>

        <div id="container-cartao">
            <form class="payment-form" id="form-cartao">
                <div class="input-group">
                    <input type="text" placeholder="NÚMERO DO CARTÃO" id="num-cartao">
                    <span class="icon">💳</span>
                </div>
                <div class="input-group">
                    <input type="text" placeholder="DATA (MM/AA)" id="data-validade" maxlength="5">
                    <span class="icon">📅</span>
                </div>
                <div class="input-group">
                    <input type="password" placeholder="CÓDIGO DE SEGURANÇA" maxlength="3">
                    <span class="icon">🔒</span>
                </div>
                <button type="submit" class="btn-submit">CADASTRAR CARTÃO</button>
            </form>
        </div>

        <div id="container-pix" style="display: none;">
            <div class="pix-container">
                <div class="input-group">
                    <input type="text" id="cpf" placeholder="DIGITE SEU CPF" maxlength="14">
                    <span class="icon">👤</span>
                </div>

                <button type="button" class="btn-submit" id="btn-gerar-pix" onclick="gerarPix()">GERAR QR CODE</button>

                <div id="area-qrcode" style="display: none; text-align: center;">
                    <img src="img/qrcode.png" alt="QR Code" class="qrcode">
                    <div class="timer" id="display-timer">05:00</div>
                </div>
            </div>
        </div>
    </main>
    <script src="js/script.js"></script>
</body>

</html>
