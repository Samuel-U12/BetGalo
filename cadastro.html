<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BetGalo - Criar Conta</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Julius+Sans+One&family=Libre+Barcode+39+Text&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/cabecalho.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body class="bg-slate-900 text-white font-sans min-h-screen flex flex-col justify-between">

    <!-- CABEÇALHO PADRÃO -->
    <header class="cabecalho">
        <div class="logo">
            <img src="img/image 22.png" id="logo-do-site" alt="logo">
            <span id="logo-texto">BET GALO</span>
        </div>

        <nav class="menu">
            <a href="index.html" class="menu-item item-ativo">HOME</a>
            <a href="apostas.html" class="menu-item">APOSTAS</a>
            <a href="cassino.html" class="menu-item">CASSINO</a>
        </nav>

        <div class="link-perfil flex gap-3">
            <a href="login.html" class="text-xs bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold py-2 px-4 rounded-lg transition uppercase tracking-wider no-underline">Login</a>
        </div>
    </header>

    <!-- FORMULÁRIO DE CADASTRO -->
    <main class="container mx-auto p-4 md:p-8 flex-grow flex items-center justify-center">
        <div class="w-full max-w-md bg-[#333] p-8 rounded-2xl shadow-xl border border-slate-700">
            
            <div class="text-center mb-6">
                <h2 class="text-2xl font-black tracking-wide uppercase text-amber-500">Crie sua Conta</h2>
                <p class="text-slate-400 text-xs mt-1">Cadastre-se em menos de 2 minutos e comece a jogar</p>
            </div>

            <form id="cadastroForm" onsubmit="lidarCadastro(event)" class="space-y-4">
                <div>
                    <label class="block text-xs text-slate-400 mb-1 font-semibold uppercase tracking-wider">Nome Completo</label>
                    <input type="text" required placeholder="Digite seu nome completo" class="w-full bg-slate-900 border border-slate-700 focus:border-amber-500 rounded-lg p-2.5 text-sm text-white outline-none transition">
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs text-slate-400 mb-1 font-semibold uppercase tracking-wider">CPF</label>
                        <input type="text" required placeholder="000.000.000-00" class="w-full bg-slate-900 border border-slate-700 focus:border-amber-500 rounded-lg p-2.5 text-sm text-white outline-none transition">
                    </div>
                    <div>
                        <label class="block text-xs text-slate-400 mb-1 font-semibold uppercase tracking-wider">Celular</label>
                        <input type="tel" required placeholder="(00) 00000-0000" class="w-full bg-slate-900 border border-slate-700 focus:border-amber-500 rounded-lg p-2.5 text-sm text-white outline-none transition">
                    </div>
                </div>

                <div>
                    <label class="block text-xs text-slate-400 mb-1 font-semibold uppercase tracking-wider">E-mail</label>
                    <input type="email" required placeholder="seu@email.com" class="w-full bg-slate-900 border border-slate-700 focus:border-amber-500 rounded-lg p-2.5 text-sm text-white outline-none transition">
                </div>

                <div>
                    <label class="block text-xs text-slate-400 mb-1 font-semibold uppercase tracking-wider">Criar Senha</label>
                    <input type="password" required placeholder="No mínimo 6 caracteres" class="w-full bg-slate-900 border border-slate-700 focus:border-amber-500 rounded-lg p-2.5 text-sm text-white outline-none transition">
                </div>

                <div class="flex items-start gap-2 pt-1">
                    <input type="checkbox" id="termos" required class="mt-1 accent-amber-500">
                    <label for="termos" class="text-xs text-slate-300">
                        Declaro que tenho mais de 18 anos e aceito os Termos e Condições da BetGalo.
                    </label>
                </div>

                <div class="pt-2">
                    <button type="submit" class="w-full flex items-center justify-center gap-2 bg-amber-500 hover:bg-amber-600 text-slate-950 font-black py-3 px-4 rounded-xl text-sm transition uppercase tracking-wider shadow-lg border-0 cursor-pointer">
                        <i class="fa-solid fa-user-plus"></i> Finalizar Cadastro
                    </button>
                </div>
            </form>

            <div class="mt-6 pt-4 border-t border-slate-700/60 text-center text-sm text-slate-400">
                Já possui uma conta? <a href="login.html" class="text-amber-500 font-bold hover:underline">Faça login</a>
            </div>
        </div>
    </main>

    <!-- RODAPÉ PADRÃO -->
    <footer>
        <div class="rodape">
            <img src="img/Times.png" alt="times">
            <div class="sobre-nos">
                <h1>Sobre nós:</h1>
                <p>BetGalo.com é um site operado pela Kaizen Gaming Brasil Ltda. ...</p>
            </div>
        </div>
    </footer>

    <script>
        function lidarCadastro(event) {
            event.preventDefault();
            // Simula a criação de conta com sucesso
            alert('Conta criada com sucesso! Faça seu primeiro login.');
            window.location.href = 'login.html';
        }
    </script>
</body>
</html>
